        uses: actions/checkout@v4

      - name: Az CLI login
        uses: azure/login@v2
        with:
          client-id: 2b6fa9d7-7dba-4600-a58a-5e25554997aa
          tenant-id: 531ff96d-0ae9-462a-8d2d-bec7c0b42082
          allow-no-subscriptions: true

      - name: Stop VM - CFT PTL
        run: ./scripts/vm/manual-start-stop.sh stop

  vmss:
