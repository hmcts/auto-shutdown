          tenant-id: 531ff96d-0ae9-462a-8d2d-bec7c0b42082
          allow-no-subscriptions: true

      - name: Stop Flexible Server - CFT PTL
        run: ./scripts/flexible-server/manual-start-stop.sh stop

  vm:
    runs-on: ubuntu-latest
    steps:
